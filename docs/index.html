<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Poker Equity Calculator</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<header>
  <h1>Poker Equity Calculator</h1>
  <a class="github-link" href="https://github.com/YOUR_USERNAME/YOUR_REPO"
     target="_blank" rel="noopener" aria-label="View source on GitHub">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
</header>

<main class="layout">
  <aside class="settings">
    <h2>Settings</h2>

    <label class="field">
      <span>Action</span>
      <select id="action">
        <option value="exact">Hand calculation (exact)</option>
        <option value="mc" selected>Hand calculation (Monte Carlo)</option>
        <option value="hybrid">Hand calculation (hybrid, stratified)</option>
        <option value="approx">Network approximation (vs 1 random opponent)</option>
      </select>
      <small class="hint" id="action-hint"></small>
    </label>

    <label class="field">
      <span>Hero cards</span>
      <input id="hero" type="text" value="AsKs" spellcheck="false" autocomplete="off" />
      <small class="hint">Exactly 2 cards, e.g. AsKs.</small>
    </label>

    <label class="field">
      <span>Board</span>
      <input id="board" type="text" value="" placeholder="e.g. Qs7s2d (or blank for preflop)"
             spellcheck="false" autocomplete="off" />
      <small class="hint">0, 3, 4 or 5 cards.</small>
    </label>

    <div class="field">
      <span>Opponent ranges</span>
      <div id="opp-list"></div>
      <button id="add-opp" type="button" class="btn-secondary">+ Add opponent</button>
      <small class="hint">e.g. QQ+,AKs:0.5 or random</small>
      <small class="hint warn" id="multiway-warning" hidden></small>
    </div>

    <label class="field" id="samples-row">
      <span>Samples</span>
      <input id="samples" type="number" min="2" step="1000" value="200000" />
    </label>

    <label class="field" id="seed-row">
      <span>Seed</span>
      <input id="seed" type="number" min="0" step="1" value="1" />
    </label>

    <label class="field" id="weights-row" hidden>
      <span>Weights</span>
      <input id="weights" type="text"
             value="data/approx_weights_s0.bin,data/approx_weights_s1.bin,data/approx_weights_s2.bin,data/approx_weights_s3.bin" />
      <small class="hint">One file (single model) or four comma-separated (per street).</small>
    </label>

    <div class="actions-row">
      <button id="calc" type="button" class="btn-primary">Calculate</button>
      <button id="cancel" type="button" class="btn-secondary" hidden>Cancel</button>
    </div>
    <div id="status" class="status" hidden></div>
  </aside>

  <section class="table-wrap">
    <div class="felt">
      <div class="opponents" id="opponents"></div>
      <div class="board" id="board-cards"></div>
      <div class="hero" id="hero-cards"></div>
    </div>
  </section>
</main>

<section class="output" id="output">
  <div class="output-empty">Enter your cards and press Calculate.</div>
</section>

<script src="./app.js"></script>
</body>
</html>
